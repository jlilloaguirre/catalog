apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
  name: nginx-servers
spec:
  replicas: 1
  selector:
    matchLabels:
      service: nginx-server
  template:
    metadata:
      labels:
        service: nginx-server
    spec:
      containers:
        - image: nginxdemos/hello
          name: nginx-container
          envFrom:
            - configMapRef:
                name: nginx-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: config-volume
              mountPath: /etc/demo-config
              readOnly: true
            - name: pvc-volume
              mountPath: /cache

        - image: busybox:1.36
          name: heartbeat-sidecar
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                if wget -q -O /dev/null http://localhost:80; then
                  STATUS="UP"
                else
                  STATUS="DOWN"
                fi
                echo "$(date '+%Y-%m-%d %H:%M:%S') app on localhost:80 is $STATUS" \
                  | tee -a /var/log/heartbeat/heartbeat.log
                sleep 5
              done
          volumeMounts:
            - name: heartbeat-logs
              mountPath: /var/log/heartbeat

      volumes:
        - name: config-volume
          configMap:
            name: nginx-config

        - name: heartbeat-logs
          emptyDir: {}

        - name: pvc-volume
          persistentVolumeClaim:
            claimName: my-volume